<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧶 勾針記錄</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* ── THEME: WARM (default) ── */
:root {
  --bg: #F7F3EE; --card: #FFFFFF; --brown: #3D2B1F; --brown-light: #7A5C4E;
  --clay: #C4674A; --clay-light: #E8896E; --teal: #7AADA8; --teal-light: #A8CEC9;
  --cream: #EDE6DC; --progress-bg: #E0D8CF;
  --shadow: 0 2px 12px rgba(61,43,31,0.10); --radius: 16px;
  --header-bg: #F7F3EE; --header-text: #3D2B1F; --header-sub: #7A5C4E;
}

/* ── THEME: BLUE ── */
[data-theme="morandi"] {
  --bg: #EEF4F8; --card: #F8FBFD; --brown: #2C4A5A; --brown-light: #6A8E9F;
  --clay: #5B9BB5; --clay-light: #85B8CC; --teal: #7AADA8; --teal-light: #A8CEC9;
  --cream: #D8EAF2; --progress-bg: #CCE2EE;
  --shadow: 0 2px 12px rgba(44,74,90,0.10);
  --header-bg: #EEF4F8; --header-text: #2C4A5A; --header-sub: #6A8E9F;
}

/* ── THEME: FOREST ── */
[data-theme="dark"] {
  --bg: #EBF0EB; --card: #F5F8F5; --brown: #2D4A35; --brown-light: #6A8C72;
  --clay: #4A7C59; --clay-light: #72A882; --teal: #5B8C7A; --teal-light: #8CB5A5;
  --cream: #D6E5D8; --progress-bg: #C4D9C8;
  --shadow: 0 2px 12px rgba(45,74,53,0.12);
  --header-bg: #EBF0EB; --header-text: #2D4A35; --header-sub: #6A8C72;
}

/* theme switcher */
.theme-switcher { display: flex; gap: 8px; padding: 0 16px 16px; }
.theme-dot { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; transition: transform 0.15s, border-color 0.15s; flex-shrink: 0; }
.theme-dot:active { transform: scale(0.9); }
.theme-dot.active { border-color: var(--brown); }
.theme-dot-warm { background: linear-gradient(135deg, #F7F3EE 50%, #C4674A 50%); }
.theme-dot-morandi { background: linear-gradient(135deg, #EEF4F8 50%, #5B9BB5 50%); }
.theme-dot-dark { background: linear-gradient(135deg, #EBF0EB 50%, #4A7C59 50%); }

html { background: var(--bg); }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--brown); min-height: 100vh; max-width: 430px; margin: 0 auto; overflow-x: hidden; }
.header { background: var(--header-bg); color: var(--header-text); padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
.header-back { background: none; border: none; color: var(--header-text); font-size: 26px; cursor: pointer; padding: 4px 8px 4px 0; display: none; line-height: 1; }
.header-title { font-size: 20px; font-weight: 600; flex: 1; }
.header-sub { font-size: 13px; color: var(--header-sub); margin-top: 2px; }
.page { display: none; padding: 20px 16px 100px; }
.page.active { display: block; }
.section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brown-light); margin-bottom: 12px; }
.project-card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer; transition: transform 0.12s; border: 2px solid transparent; }
.project-card:active { transform: scale(0.98); }
.project-card.active-project { border-color: var(--clay); }
.project-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.project-name { font-size: 17px; font-weight: 600; }
.project-type { font-size: 11px; background: var(--cream); color: var(--brown-light); padding: 3px 8px; border-radius: 20px; font-weight: 500; }
.project-meta { font-size: 13px; color: var(--brown-light); margin-bottom: 10px; }
.progress-bar-wrap { background: var(--progress-bg); border-radius: 99px; height: 8px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--clay), var(--clay-light)); transition: width 0.4s ease; }
.progress-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.progress-pct { font-size: 12px; font-weight: 600; color: var(--clay); }
.progress-detail { font-size: 12px; color: var(--brown-light); }
.add-btn { width: 100%; padding: 16px; border-radius: var(--radius); border: 2px dashed var(--clay-light); background: none; color: var(--clay); font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Inter', sans-serif; }
.add-btn:active { background: var(--cream); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(61,43,31,0.4); z-index: 200; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: 24px 24px 0 0; padding: 28px 20px 44px; width: 100%; max-width: 430px; animation: slideUp 0.25s ease; max-height: 90vh; overflow-y: auto; }
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.field-label { font-size: 13px; font-weight: 500; color: var(--brown-light); margin-bottom: 6px; }
.field-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--cream); background: var(--bg); font-size: 16px; font-family: 'Inter', sans-serif; color: var(--brown); margin-bottom: 16px; outline: none; transition: border-color 0.15s; }
.field-input:focus { border-color: var(--clay); }
.type-toggle { display: flex; gap: 10px; margin-bottom: 16px; }
.type-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--cream); background: var(--bg); font-size: 14px; font-weight: 500; color: var(--brown-light); cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; line-height: 1.5; }
.type-btn.selected { background: var(--clay); color: white; border-color: var(--clay); }
.modal-actions { display: flex; gap: 10px; margin-top: 8px; }
.btn-cancel { flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid var(--cream); background: none; color: var(--brown-light); font-size: 15px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; }
.btn-save { flex: 2; padding: 14px; border-radius: 12px; border: none; background: var(--clay); color: white; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
.btn-save:active { background: var(--clay-light); }
.module-list { margin-bottom: 16px; }
.module-check { display: flex; align-items: center; gap: 12px; padding: 16px 14px; border-radius: 12px; border: 1.5px solid var(--cream); background: var(--bg); margin-bottom: 10px; cursor: pointer; min-height: 56px; }
.module-check input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--clay); cursor: pointer; flex-shrink: 0; }
.module-check-label { font-size: 15px; font-weight: 500; flex: 1; }
.module-check-sub { font-size: 12px; color: var(--brown-light); }
.module-check.checked { border-color: var(--clay); background: #FDF6F3; }
.module-check.disabled { opacity: 0.5; cursor: default; }
.custom-counter-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.custom-counter-row .field-input { margin-bottom: 0; flex: 1; }
.custom-remove-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--cream); color: var(--brown-light); font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.add-custom-btn { width: 100%; padding: 11px; border-radius: 10px; border: 1.5px dashed var(--teal-light); background: none; color: var(--teal); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; margin-bottom: 16px; }
.counter-progress { background: var(--card); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.counter-progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.counter-progress-label { font-size: 13px; font-weight: 500; color: var(--brown-light); }
.counter-progress-pct { font-size: 22px; font-weight: 600; color: var(--clay); font-family: 'DM Mono', monospace; }
.counter-progress-detail { font-size: 12px; color: var(--brown-light); margin-top: 6px; }
.counter-section { background: var(--card); border-radius: var(--radius); padding: 22px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.counter-label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brown-light); margin-bottom: 16px; }
.counter-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count-btn { width: 64px; height: 64px; border-radius: 50%; border: none; font-size: 28px; font-weight: 300; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; flex-shrink: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.count-btn:active { transform: scale(0.92); }
.clay-minus { background: var(--cream); color: var(--brown-light); }
.clay-plus { background: var(--clay); color: white; }
.teal-minus { background: var(--teal-light); color: white; }
.teal-plus { background: var(--teal); color: white; }
.brown-minus { background: var(--cream); color: var(--brown-light); }
.brown-plus { background: var(--brown); color: white; }
.count-display { flex: 1; text-align: center; cursor: pointer; }
.count-number { font-family: 'DM Mono', monospace; font-size: 72px; font-weight: 500; color: var(--brown); line-height: 1; letter-spacing: -2px; }
.teal-num { color: var(--teal); }
.brown-num { color: var(--brown-light); }
.count-sub { font-size: 12px; color: var(--brown-light); margin-top: 4px; }
.reset-row { display: flex; justify-content: center; margin-top: 14px; }
.reset-btn { background: none; border: 1.5px solid var(--cream); color: var(--brown-light); font-size: 13px; font-weight: 500; padding: 8px 20px; border-radius: 99px; cursor: pointer; font-family: 'Inter', sans-serif; touch-action: manipulation; }
.reset-btn:active { background: var(--cream); }
.delete-area { margin-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.delete-project-btn { background: none; border: none; color: #C4674A66; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; padding: 8px; }
.delete-project-btn:active { color: var(--clay); }
.complete-project-btn { background: none; border: 1.5px solid var(--teal); color: var(--teal); font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; padding: 10px 24px; border-radius: 99px; touch-action: manipulation; }
.complete-project-btn:active { background: var(--teal); color: white; }
.project-card.completed { opacity: 0.7; }
.project-card.completed .project-name { color: var(--brown-light); }
.completed-badge { font-size: 11px; background: var(--teal-light); color: var(--teal); padding: 3px 8px; border-radius: 20px; font-weight: 500; }
.jump-modal { display: none; position: fixed; inset: 0; background: rgba(61,43,31,0.4); z-index: 300; align-items: center; justify-content: center; }
.jump-modal.open { display: flex; }
.jump-box { background: var(--card); border-radius: 20px; padding: 28px 24px; width: 280px; animation: popIn 0.2s ease; }
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.jump-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
.jump-input { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--cream); background: var(--bg); font-size: 28px; font-family: 'DM Mono', monospace; color: var(--brown); text-align: center; outline: none; margin-bottom: 16px; }
.jump-input:focus { border-color: var(--clay); }
.jump-actions { display: flex; gap: 10px; }
.jump-cancel { flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid var(--cream); background: none; color: var(--brown-light); font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; }
.jump-ok { flex: 1; padding: 12px; border-radius: 10px; border: none; background: var(--clay); color: white; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
.chart-toolbar { display: flex; gap: 8px; padding: 16px 16px 0; flex-wrap: wrap; }
.chart-tool-btn { padding: 8px 14px; border-radius: 99px; border: 1.5px solid var(--cream); background: var(--card); font-size: 13px; font-weight: 500; color: var(--brown-light); cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap; }
.chart-tool-btn:active { background: var(--cream); }
.chart-status-bar { padding: 10px 16px; font-size: 13px; color: var(--clay); font-weight: 500; min-height: 40px; display: flex; align-items: center; gap: 8px; }
.chart-canvas-wrap { position: relative; width: 100%; overflow: hidden; background: #1a1410; }
canvas#chartCanvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
.chart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 12px; color: var(--brown-light); padding: 40px 20px; text-align: center; }
.chart-empty .emoji { font-size: 48px; }
.chart-upload-btn { padding: 14px 28px; border-radius: 12px; border: none; background: var(--clay); color: white; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
.chart-info { padding: 10px 16px 16px; font-size: 12px; color: var(--brown-light); line-height: 1.6; }
.skip-btn { background: var(--cream); border: none; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: 'Inter', sans-serif; color: var(--brown-light); }
.focus-mode-overlay { display: none; position: fixed; inset: 0; z-index: 500; user-select: none; -webkit-user-select: none; background: var(--bg); flex-direction: column; }
.focus-mode-overlay.active { display: flex; }
.focus-exit { position: absolute; top: 16px; right: 16px; background: var(--cream); border: none; border-radius: 99px; color: var(--brown); font-size: 13px; font-weight: 500; padding: 8px 16px; cursor: pointer; font-family: 'Inter', sans-serif; z-index: 10; }
.focus-band { flex: 1; display: flex; position: relative; border-bottom: 1px solid var(--cream); min-height: 0; }
.focus-band:last-child { border-bottom: none; }
.focus-band-left { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
.focus-band-right { flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
.focus-band-center { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 2; }
.focus-band-num { font-family: 'DM Mono', monospace; font-weight: 500; color: var(--brown); line-height: 1; letter-spacing: -2px; }
.focus-band-lbl { font-size: 11px; color: var(--brown-light); margin-top: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
.focus-band-arrow { font-size: 18px; color: var(--progress-bg); pointer-events: none; }
.focus-band-divider { position: absolute; left: 50%; top: 20%; bottom: 20%; width: 1px; background: var(--cream); pointer-events: none; }
.focus-band-flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.focus-band-flash.flash-left { animation: flashAnim 0.25s ease-out forwards; }
.focus-band-flash.flash-right { animation: flashAnim 0.25s ease-out forwards; }
@keyframes flashAnim { 0% { opacity: 0.35; } 100% { opacity: 0; } }
.focus-mode-btn { background: var(--cream); border: none; border-radius: 99px; color: var(--brown-light); font-size: 13px; font-weight: 500; padding: 8px 16px; cursor: pointer; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 6px; margin: 0 auto 4px; }
.notes-textarea { width: 100%; min-height: 200px; padding: 16px; border-radius: var(--radius); border: 1.5px solid var(--cream); background: var(--card); font-size: 15px; font-family: 'Inter', sans-serif; color: var(--brown); resize: none; outline: none; box-shadow: var(--shadow); line-height: 1.6; }
.install-banner { background: var(--brown); color: var(--bg); padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; border-radius: var(--radius); }
.install-banner-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
.install-banner-text { flex: 1; font-size: 13px; line-height: 1.5; }
.install-banner-text strong { display: block; font-size: 14px; margin-bottom: 3px; }
.install-banner-close { background: none; border: none; color: var(--bg); font-size: 20px; cursor: pointer; padding: 0 0 0 8px; opacity: 0.6; flex-shrink: 0; }
.notes-textarea:focus { border-color: var(--teal); }
.notes-save-btn { width: 100%; margin-top: 12px; padding: 15px; border-radius: 12px; border: none; background: var(--teal); color: white; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
.bottom-tab { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: var(--card); border-top: 1px solid var(--cream); display: flex; z-index: 100; }
.tab-btn { flex: 1; padding: 10px 4px 14px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: 'Inter', sans-serif; color: var(--brown-light); font-size: 10px; font-weight: 500; transition: color 0.15s; }
.tab-btn.active { color: var(--clay); }
.tab-icon { font-size: 20px; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--brown); color: var(--bg); padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500; opacity: 0; transition: all 0.3s; z-index: 500; white-space: nowrap; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--brown-light); }
.empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>

<div class="header" id="header">
  <button class="header-back" id="headerBack" onclick="goHome()">&#8249;</button>
  <div style="flex:1">
    <div class="header-title" id="headerTitle">&#x1F9F6; 我的作品</div>
    <div class="header-sub" id="headerSub" style="display:none"></div>
  </div>
</div>

<div class="page active" id="pageList">
  <div class="theme-switcher">
    <div class="theme-dot theme-dot-warm active" id="dotWarm" onclick="setTheme('warm')" title="暖棕陶土"></div>
    <div class="theme-dot theme-dot-morandi" id="dotMorandi" onclick="setTheme('morandi')" title="莫蘭迪"></div>
    <div class="theme-dot theme-dot-dark" id="dotDark" onclick="setTheme('dark')" title="深色"></div>
    <span style="font-size:12px;color:var(--brown-light);align-self:center;margin-left:4px">主題</span>
  </div>
  <div id="installBanner" class="install-banner">
    <div class="install-banner-icon">📲</div>
    <div class="install-banner-text">
      <strong>建議加入主畫面</strong>
      Safari → 分享按鈕 → 「加入主畫面」，上傳照片功能才能正常使用
    </div>
  </div>
  <div class="section-label">進行中的作品</div>
  <div id="projectList"></div>
  <button class="add-btn" onclick="openAddModal()">＋ 新增作品</button>
</div>

<div class="page" id="pageCounter">
  <div class="counter-progress">
    <div class="counter-progress-top">
      <span class="counter-progress-label">整體進度</span>
      <span class="counter-progress-pct" id="cPct">0%</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="cBar" style="width:0%"></div></div>
    <div class="counter-progress-detail" id="cDetail"></div>
  </div>
  <div style="text-align:center;margin-bottom:14px">
    <button class="focus-mode-btn" onclick="enterFocusMode()">⚡ 專注模式</button>
  </div>
  <div id="counterModules"></div>
  <div class="delete-area">
    <button class="complete-project-btn" onclick="toggleComplete()">✓ 標記完成</button>
    <button class="delete-project-btn" onclick="confirmDelete()">&#x1F5D1; 刪除此作品</button>
  </div>
</div>

<!-- FOCUS MODE OVERLAY -->
<div class="focus-mode-overlay" id="focusOverlay">
  <button class="focus-exit" onclick="exitFocusMode()">✕ 退出專注</button>
  <div id="focusBands" style="flex:1;display:flex;flex-direction:column;width:100%;padding-top:52px"></div>
</div>

<div class="page" id="pageChart" style="padding:0 0 100px">
  <div id="chartContent"></div>
</div>

<div class="page" id="pageNotes">
  <div class="section-label">作品筆記</div>
  <textarea class="notes-textarea" id="notesArea" placeholder="針號、線材、花樣說明、提醒事項…"></textarea>
  <button class="notes-save-btn" onclick="saveNotes()">儲存筆記</button>
</div>

<div class="bottom-tab" id="bottomTab">
  <button class="tab-btn active" id="tabList" onclick="switchTab('list')">
    <span class="tab-icon">&#x1F4CB;</span>作品
  </button>
  <button class="tab-btn" id="tabCounter" onclick="switchTab('counter')" style="display:none">
    <span class="tab-icon">&#x1F9F5;</span>計數
  </button>
  <button class="tab-btn" id="tabChart" onclick="switchTab('chart')" style="display:none">
    <span class="tab-icon">&#x1F5FA;</span>織圖
  </button>
  <button class="tab-btn" id="tabNotes" onclick="switchTab('notes')" style="display:none">
    <span class="tab-icon">&#x1F4DD;</span>筆記
  </button>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">新增作品</div>
    <div class="field-label">作品名稱</div>
    <input class="field-input" id="newName" placeholder="例：小熊帽子、方形杯墊…" type="text">
    <div class="field-label">類型</div>
    <div class="type-toggle">
      <button class="type-btn selected" id="typeFlat" onclick="selectType('flat')">平織（行）<br><span style="font-size:11px;font-weight:400;opacity:0.8">圍巾、毯子、方巾</span></button>
      <button class="type-btn" id="typeRound" onclick="selectType('round')">圓織（圈）<br><span style="font-size:11px;font-weight:400;opacity:0.8">帽子、玩偶、杯套</span></button>
    </div>
    <div class="field-label">總行數 / 圈數</div>
    <input class="field-input" id="newTotal" placeholder="例：40" type="number" inputmode="numeric">
    <div class="field-label" style="margin-top:4px">計數器模組</div>
    <div class="module-list">
      <div class="module-check checked disabled">
        <input type="checkbox" checked disabled>
        <div><div class="module-check-label">行 / 圈數</div><div class="module-check-sub">主進度，必選</div></div>
      </div>
      <div class="module-check" id="modStitchCheck" onclick="toggleModule('stitch')">
        <input type="checkbox" id="modStitch" onclick="return false">
        <div><div class="module-check-label">針數計數</div><div class="module-check-sub">記錄每行針數</div></div>
      </div>
      <div class="module-check" id="modRepeatCheck" onclick="toggleModule('repeat')">
        <input type="checkbox" id="modRepeat" onclick="return false">
        <div><div class="module-check-label">花樣重複</div><div class="module-check-sub">記錄花樣循環次數</div></div>
      </div>
    </div>
    <div class="field-label">自訂計數器</div>
    <div id="customCounterList"></div>
    <button class="add-custom-btn" onclick="addCustomCounter()">＋ 新增自訂計數器</button>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">取消</button>
      <button class="btn-save" onclick="saveNewProject()">建立</button>
    </div>
  </div>
</div>

<div class="jump-modal" id="jumpModal">
  <div class="jump-box">
    <div class="jump-title" id="jumpTitle">跳至？</div>
    <input class="jump-input" id="jumpInput" type="number" inputmode="numeric" placeholder="0">
    <div class="jump-actions">
      <button class="jump-cancel" onclick="closeJump()">取消</button>
      <button class="jump-ok" onclick="applyJump()">確定</button>
    </div>
  </div>
</div>

<input type="file" id="chartFileInput" accept="image/*" style="display:none">

<!-- ANCHOR MODAL -->

<div class="toast" id="toast"></div>

<script>
var projects = [];
var currentProjectId = null;
var currentTab = 'list';
var jumpTarget = null;
var newProjectType = 'flat';
var anchorCurrentRow = 1;

var newCustomCounters = [];
var chartCalibStep = 0;
var chartImg = null;
var modStitchOn = false;
var modRepeatOn = false;

function save() { localStorage.setItem('crochet_v2', JSON.stringify(projects)); }
function load() {
  var raw = localStorage.getItem('crochet_v2');
  if (!raw) raw = localStorage.getItem('crochet_projects');
  if (raw) { try { projects = JSON.parse(raw); } catch(e) { projects = []; } }
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    if (!p.modules) p.modules = { stitch: true, repeat: true, custom: [] };
    if (!p.modules.custom) p.modules.custom = [];
    if (!p.chart) p.chart = { imageData: null, anchors: [], rowOverrides: {}, stitchX1: null, stitchX2: null };
    if (!p.chart.anchors) {
      var ancs = [];
      if (p.chart.rowY1 !== null && p.chart.rowY1 !== undefined) ancs.push({row:1, y:p.chart.rowY1});
      if (p.chart.rowY2 !== null && p.chart.rowY2 !== undefined) ancs.push({row:2, y:p.chart.rowY2});
      p.chart.anchors = ancs;
      if (!p.chart.rowOverrides) p.chart.rowOverrides = {};
    }
    if (p.stitch === undefined) p.stitch = 0;
    if (p.repeat === undefined) p.repeat = 0;
  }
}
function genId() { return 'p_' + Date.now() + '_' + Math.floor(Math.random() * 9999); }
function getProject() {
  if (!currentProjectId) return null;
  for (var i = 0; i < projects.length; i++) { if (projects[i].id === currentProjectId) return projects[i]; }
  return null;
}
function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleComplete() {
  var p = getProject(); if (!p) return;
  p.completed = !p.completed;
  save();
  renderCounter();
  renderList();
  showToast(p.completed ? '✓ 已標記完成' : '↩ 已移回進行中');
}

function renderList() {
  var el = document.getElementById('projectList');
  var active = projects.filter(function(p) { return !p.completed; });
  var done = projects.filter(function(p) { return p.completed; });

  if (projects.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emoji">&#x1F9F6;</div><p>還沒有作品<br>點下方「新增作品」開始記錄！</p></div>';
    return;
  }

  var html = '';

  // Active projects
  if (active.length === 0 && done.length > 0) {
    html += '<div class="empty-state" style="padding:20px"><p style="font-size:14px">所有作品都完成了！🎉</p></div>';
  }
  for (var i = 0; i < active.length; i++) {
    html += renderProjectCard(active[i]);
  }

  // Completed section
  if (done.length > 0) {
    html += '<div class="section-label" style="margin-top:20px">已完成</div>';
    for (var j = 0; j < done.length; j++) {
      html += renderProjectCard(done[j]);
    }
  }

  el.innerHTML = html;
}

function renderProjectCard(p) {
  var pct = p.total > 0 ? Math.min(100, Math.round((p.row / p.total) * 100)) : 0;
  var unit = p.type === 'round' ? '圈' : '行';
  var ac = p.id === currentProjectId ? ' active-project' : '';
  var completedClass = p.completed ? ' completed' : '';
  var badge = p.completed ? '<span class="completed-badge">✓ 完成</span>' : '<div class="project-type">' + (p.type === 'round' ? '圓織' : '平織') + '</div>';
  var chartBadge = (p.chart && p.chart.imageData) ? ' <span style="font-size:11px;color:var(--teal)">🗺</span>' : '';
  var html = '<div class="project-card' + ac + completedClass + '" onclick="openProject(\'' + p.id + '\')">';
  html += '<div class="project-card-top"><div class="project-name">' + escH(p.name) + chartBadge + '</div>';
  html += badge + '</div>';
  html += '<div class="project-meta">第 ' + p.row + ' ' + unit + '　共 ' + p.total + ' ' + unit + '</div>';
  html += '<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="progress-row"><span class="progress-pct">' + pct + '%</span><span class="progress-detail">整體進度</span></div>';
  html += '</div>';
  return html;
}

function updateTabVisibility() {
  var inProject = !!currentProjectId;
  document.getElementById('tabList').style.display = inProject ? 'none' : 'flex';
  document.getElementById('tabCounter').style.display = inProject ? 'flex' : 'none';
  document.getElementById('tabChart').style.display = inProject ? 'flex' : 'none';
  document.getElementById('tabNotes').style.display = inProject ? 'flex' : 'none';
}

function openProject(id) {
  window.scrollTo(0,0);
  currentProjectId = id;
  pendingDelete = false;
  updateTabVisibility();
  switchTab('counter');
}
function goHome() {
  currentProjectId = null;
  document.getElementById('headerTitle').textContent = '🧶 我的作品';
  document.getElementById('headerSub').style.display = 'none';
  document.getElementById('headerBack').style.display = 'none';
  updateTabVisibility();
  switchTab('list');
}

var palette = ['clay','teal','brown'];

function renderCounter() {
  var p = getProject(); if (!p) return;
  var unit = p.type === 'round' ? '圈' : '行';
  var pct = p.total > 0 ? Math.min(100, Math.round((p.row / p.total) * 100)) : 0;
  document.getElementById('cPct').textContent = pct + '%';
  document.getElementById('cBar').style.width = pct + '%';
  document.getElementById('cDetail').textContent = '第 ' + p.row + ' ' + unit + '，共 ' + p.total + ' ' + unit;
  document.getElementById('headerTitle').textContent = p.name;
  document.getElementById('headerSub').textContent = p.type === 'round' ? '圓織' : '平織';
  document.getElementById('headerSub').style.display = 'block';
  document.getElementById('headerBack').style.display = 'block';

  var html = buildSection(
    (p.type === 'round' ? '&#x1F504; 圈數' : '&#x1F9F5; 行 / 段'),
    p.row, '點擊直接設定', 'clay', 'adjustRow(-1)', 'adjustRow(1)', 'openJump("row")', ''
  );
  if (p.modules.stitch) {
    html += buildSection('&#x1F522; 針數', p.stitch, '點擊直接設定', 'teal', 'adjustStitch(-1)', 'adjustStitch(1)', 'openJump("stitch")', 'resetStitch()');
  }
  if (p.modules.repeat) {
    html += buildSection('&#x1F501; 花樣重複', p.repeat, '次', 'brown', 'adjustRepeat(-1)', 'adjustRepeat(1)', 'openJump("repeat")', 'resetRepeat()');
  }
  var cs = p.modules.custom;
  for (var i = 0; i < cs.length; i++) {
    var col = palette[i % palette.length];
    html += buildSection(escH(cs[i].name), cs[i].value, '次', col,
      'adjustCustom('+i+',-1)', 'adjustCustom('+i+',1)', 'openJump("custom_'+i+'")', 'resetCustom('+i+')');
  }
  var completeBtn = document.querySelector('.complete-project-btn');
  if (completeBtn) {
    completeBtn.textContent = p.completed ? '↩ 移回進行中' : '✓ 標記完成';
    completeBtn.style.borderColor = p.completed ? 'var(--brown-light)' : 'var(--teal)';
    completeBtn.style.color = p.completed ? 'var(--brown-light)' : 'var(--teal)';
  }

  document.getElementById('counterModules').innerHTML = html;
}

function buildSection(label, value, sub, color, mFn, pFn, jFn, rFn) {
  var numClass = 'count-number' + (color !== 'clay' ? ' ' + color + '-num' : '');
  var h = '<div class="counter-section">';
  h += '<div class="counter-label">' + label + '</div>';
  h += '<div class="counter-main">';
  h += '<button class="count-btn ' + color + '-minus" onclick="' + mFn + '">&#8722;</button>';
  h += '<div class="count-display" onclick="' + jFn + '">';
  h += '<div class="' + numClass + '">' + value + '</div>';
  h += '<div class="count-sub">' + sub + '</div></div>';
  h += '<button class="count-btn ' + color + '-plus" onclick="' + pFn + '">＋</button>';
  h += '</div>';
  if (rFn) h += '<div class="reset-row"><button class="reset-btn" onclick="' + rFn + '">&#x21BA; 重置</button></div>';
  h += '</div>';
  return h;
}

function adjustRow(d) { var p=getProject(); if(!p) return; p.row=Math.max(1,p.row+d); save(); renderCounter(); renderList(); if(currentTab==='chart') { drawChart(); updateChartStatusBar(p); } }
function adjustStitch(d) { var p=getProject(); if(!p) return; p.stitch=Math.max(0,p.stitch+d); save(); renderCounter(); if(currentTab==='chart') { drawChart(); updateChartStatusBar(p); } }
function resetStitch() { var p=getProject(); if(!p) return; p.stitch=0; save(); renderCounter(); showToast('針數已重置'); if(currentTab==='chart') drawChart(); }
function adjustRepeat(d) { var p=getProject(); if(!p) return; p.repeat=Math.max(0,p.repeat+d); save(); renderCounter(); }
function resetRepeat() { var p=getProject(); if(!p) return; p.repeat=0; save(); renderCounter(); showToast('花樣已重置'); }
function adjustCustom(idx,d) { var p=getProject(); if(!p) return; p.modules.custom[idx].value=Math.max(0,p.modules.custom[idx].value+d); save(); renderCounter(); }
function resetCustom(idx) { var p=getProject(); if(!p) return; p.modules.custom[idx].value=0; save(); renderCounter(); showToast('已重置'); }

function openJump(key) {
  var p = getProject(); if (!p) return;
  jumpTarget = key;
  var title = '設定數值';
  var val = 0;
  if (key === 'row') { title = '跳至第幾行/圈？'; val = p.row; }
  else if (key === 'stitch') { title = '設定針數？'; val = p.stitch; }
  else if (key === 'repeat') { title = '設定花樣重複次數？'; val = p.repeat; }
  else if (key.indexOf('custom_') === 0) {
    var idx = parseInt(key.replace('custom_',''));
    title = '設定「' + p.modules.custom[idx].name + '」？';
    val = p.modules.custom[idx].value;
  }
  document.getElementById('jumpTitle').textContent = title;
  document.getElementById('jumpInput').value = val;
  document.getElementById('jumpModal').classList.add('open');
  setTimeout(function() { document.getElementById('jumpInput').select(); }, 80);
}
function closeJump() { document.getElementById('jumpModal').classList.remove('open'); jumpTarget = null; }
function applyJump() {
  var p = getProject(); if (!p) return;
  var val = parseInt(document.getElementById('jumpInput').value) || 0;
  if (jumpTarget === 'row') p.row = Math.max(1, val);
  else if (jumpTarget === 'stitch') p.stitch = Math.max(0, val);
  else if (jumpTarget === 'repeat') p.repeat = Math.max(0, val);
  else if (jumpTarget && jumpTarget.indexOf('custom_') === 0) {
    var idx = parseInt(jumpTarget.replace('custom_',''));
    p.modules.custom[idx].value = Math.max(0, val);
  }
  save(); renderCounter(); renderList(); closeJump();
  if (currentTab === 'chart') drawChart();
}

function openAddModal() {
  newProjectType = 'flat'; newCustomCounters = []; modStitchOn = false; modRepeatOn = false;
  document.getElementById('newName').value = '';
  document.getElementById('newTotal').value = '';
  document.getElementById('typeFlat').classList.add('selected');
  document.getElementById('typeRound').classList.remove('selected');
  document.getElementById('typeFlat').innerHTML = '平織（行）<br><span style="font-size:11px;font-weight:400;opacity:0.8">圍巾、毯子、方巾</span>';
  document.getElementById('typeRound').innerHTML = '圓織（圈）<br><span style="font-size:11px;font-weight:400;opacity:0.8">帽子、玩偶、杯套</span>';
  document.getElementById('modStitch').checked = false;
  document.getElementById('modRepeat').checked = false;
  document.getElementById('modStitchCheck').classList.remove('checked');
  document.getElementById('modRepeatCheck').classList.remove('checked');
  renderCustomCounterList();
  document.getElementById('addModal').classList.add('open');
  setTimeout(function() { document.getElementById('newName').focus(); }, 80);
}
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }
function selectType(t) {
  newProjectType = t;
  document.getElementById('typeFlat').classList.toggle('selected', t==='flat');
  document.getElementById('typeRound').classList.toggle('selected', t==='round');
}
function toggleModule(name) {
  if (name === 'stitch') {
    modStitchOn = !modStitchOn;
    document.getElementById('modStitch').checked = modStitchOn;
    document.getElementById('modStitchCheck').classList.toggle('checked', modStitchOn);
  } else {
    modRepeatOn = !modRepeatOn;
    document.getElementById('modRepeat').checked = modRepeatOn;
    document.getElementById('modRepeatCheck').classList.toggle('checked', modRepeatOn);
  }
}
function addCustomCounter() { newCustomCounters.push({name:''}); renderCustomCounterList(); }
function removeCustomCounter(i) { newCustomCounters.splice(i,1); renderCustomCounterList(); }
function updateCustomName(i, val) { newCustomCounters[i].name = val; }
function renderCustomCounterList() {
  var html = '';
  for (var i = 0; i < newCustomCounters.length; i++) {
    html += '<div class="custom-counter-row">';
    html += '<input class="field-input" type="text" placeholder="計數器名稱，例：換色次數" id="cname'+i+'" value="'+escH(newCustomCounters[i].name)+'" oninput="updateCustomName('+i+',this.value)">';
    html += '<button class="custom-remove-btn" onclick="removeCustomCounter('+i+')">&#215;</button>';
    html += '</div>';
  }
  document.getElementById('customCounterList').innerHTML = html;
}
function saveNewProject() {
  var name = document.getElementById('newName').value.trim();
  var total = parseInt(document.getElementById('newTotal').value) || 0;
  if (!name) { showToast('請輸入作品名稱'); return; }
  if (total < 1) { showToast('請輸入總行數/圈數'); return; }
  var customs = [];
  for (var i = 0; i < newCustomCounters.length; i++) {
    var n = newCustomCounters[i].name.trim();
    if (n) customs.push({name:n, value:0});
  }
  var p = { id:genId(), name:name, type:newProjectType, total:total, row:1, stitch:0, repeat:0, notes:'',
    modules:{ stitch:modStitchOn, repeat:modRepeatOn, custom:customs },
    chart:{ imageData:null, rowY1:null, rowY2:null, stitchX1:null, stitchX2:null } };
  projects.push(p);
  save(); closeAddModal(); renderList(); showToast('已新增：' + name);
}

function confirmDelete() {
  if (!pendingDelete) { pendingDelete=true; showToast('再按一次確認刪除'); setTimeout(function(){pendingDelete=false;},3000); }
  else {
    var p=getProject(); if(!p) return;
    var name=p.name;
    projects=projects.filter(function(x){return x.id!==currentProjectId;});
    currentProjectId=null; save(); goHome(); showToast('已刪除：'+name);
  }
}

function saveNotes() {
  var p=getProject(); if(!p) return;
  p.notes=document.getElementById('notesArea').value;
  save(); showToast('筆記已儲存');
}

// ── THEME ──
var currentTheme = 'warm';
function setTheme(t) {
  currentTheme = t;
  document.documentElement.setAttribute('data-theme', t === 'warm' ? '' : t);
  localStorage.setItem('crochet_theme', t);
  var bgColors = { warm: '#F7F3EE', morandi: '#EEF4F8', dark: '#EBF0EB' };
  document.documentElement.style.background = bgColors[t] || '#F7F3EE';
  document.body.style.background = bgColors[t] || '#F7F3EE';
  var dots = ['warm','morandi','dark'];
  for (var i=0;i<dots.length;i++) {
    var d = document.getElementById('dot' + dots[i].charAt(0).toUpperCase() + dots[i].slice(1));
    if (d) d.classList.toggle('active', dots[i] === t);
  }
}
function loadTheme() {
  var t = localStorage.getItem('crochet_theme') || 'warm';
  setTheme(t);
}


// focus band colors per counter index
var focusBandColors = ['#C4674A','#7AADA8','#5C4A3A','#7A6A5A'];

function getFocusCounters(p) {
  var unit = p.type === 'round' ? '圈' : '行';
  var counters = [{ key:'row', label: unit + ' / 行段', getValue: function() { return p.row; } }];
  if (p.modules.stitch) counters.push({ key:'stitch', label:'針數', getValue: function() { return p.stitch; } });
  if (p.modules.repeat) counters.push({ key:'repeat', label:'花樣重複', getValue: function() { return p.repeat; } });
  var cs = p.modules.custom || [];
  for (var i=0;i<cs.length;i++) {
    (function(idx) { counters.push({ key:'custom_'+idx, label:cs[idx].name, getValue: function() { return p.modules.custom[idx].value; } }); })(i);
  }
  return counters;
}

function adjustFocusKey(key, d) {
  var p = getProject(); if (!p) return;
  if (key === 'row') p.row = Math.max(1, p.row + d);
  else if (key === 'stitch') p.stitch = Math.max(0, p.stitch + d);
  else if (key === 'repeat') p.repeat = Math.max(0, p.repeat + d);
  else if (key.indexOf('custom_') === 0) { var idx=parseInt(key.replace('custom_','')); p.modules.custom[idx].value=Math.max(0,p.modules.custom[idx].value+d); }
  save();
}

function enterFocusMode() {
  var p = getProject(); if (!p) return;
  var overlay = document.getElementById('focusOverlay');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  renderFocusBands();
}

function renderFocusBands() {
  var p = getProject(); if (!p) return;
  var counters = getFocusCounters(p);
  var bands = document.getElementById('focusBands');
  var html = '';
  for (var i=0;i<counters.length;i++) {
    var c = counters[i];
    var col = focusBandColors[i % focusBandColors.length];
    var fontSize = counters.length <= 2 ? '72px' : counters.length === 3 ? '56px' : '44px';
    html += '<div class="focus-band" id="focusBand_'+i+'" style="flex:1;display:flex;position:relative;border-bottom:1px solid rgba(255,255,255,0.07)">';
    html += '<div class="focus-band-left" id="fbl_'+i+'" style="flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden">';
    html += '<span class="focus-band-arrow">←</span>';
    html += '<div class="focus-band-flash" id="flash_left_'+i+'" style="background:rgba(122,173,168,0.3)"></div>';
    html += '</div>';
    html += '<div class="focus-band-center" style="position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:2;top:50%;transform:translate(-50%,-50%)">';
    html += '<div style="font-family:DM Mono,monospace;font-size:'+fontSize+';font-weight:500;color:var(--brown);line-height:1;letter-spacing:-2px" id="fnum_'+i+'">'+c.getValue()+'</div>';
    html += '<div style="font-size:11px;color:var(--brown-light);margin-top:6px;letter-spacing:0.05em;text-transform:uppercase">'+c.label+'</div>';
    html += '</div>';
    html += '<div class="focus-band-right" id="fbr_'+i+'" style="flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden">';
    html += '<span class="focus-band-arrow">→</span>';
    html += '<div class="focus-band-flash" id="flash_right_'+i+'" style="background:rgba('+hexToRgb(col)+',0.3)"></div>';
    html += '</div>';
    html += '<div style="position:absolute;left:50%;top:15%;bottom:15%;width:1px;background:rgba(255,255,255,0.1);pointer-events:none"></div>';
    html += '</div>';
  }
  bands.innerHTML = html;
  // attach events
  for (var j=0;j<counters.length;j++) {
    (function(idx, key) {
      var bl = document.getElementById('fbl_'+idx);
      var br = document.getElementById('fbr_'+idx);
      bl.onclick = function(e) { e.stopPropagation(); focusBandTap(idx, key, -1); };
      br.onclick = function(e) { e.stopPropagation(); focusBandTap(idx, key, 1); };
    })(j, counters[j].key);
  }
}

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}

function focusBandTap(idx, key, d) {
  adjustFocusKey(key, d);
  var p = getProject(); if (!p) return;
  var counters = getFocusCounters(p);
  // update number
  var numEl = document.getElementById('fnum_'+idx);
  if (numEl) numEl.textContent = counters[idx].getValue();
  // flash
  var flashId = d > 0 ? 'flash_right_'+idx : 'flash_left_'+idx;
  var flash = document.getElementById(flashId);
  if (flash) {
    flash.classList.remove('flash-left','flash-right');
    void flash.offsetWidth;
    flash.classList.add(d > 0 ? 'flash-right' : 'flash-left');
  }
  renderList();
}

function exitFocusMode() {
  var overlay = document.getElementById('focusOverlay');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
  setTimeout(function() { renderCounter(); renderList(); }, 50);
}

function updateFocusDisplay() {}


// chart.anchors = [{row, y}] sorted by row — raw image coords
// chart.rowOverrides = {rowNum: y} — manual drag overrides
// chart.stitchX1, stitchX2 — raw image coords of stitch 1 and 2
// chartMode: 'view' | 'addAnchor' | 'stitchCalib1' | 'stitchCalib2' | 'drag'
var chartMode = 'view';
var dragRowNum = null;
var dragStartY = null;
var dragOrigY = null;

function chartNewData() {
  return { imageData: null, anchors: [], rowOverrides: {}, stitchX1: null, stitchX2: null };
}

function getRowY(p, rowNum) {
  // Check manual override first
  if (p.chart.rowOverrides && p.chart.rowOverrides[rowNum] !== undefined) {
    return p.chart.rowOverrides[rowNum];
  }
  var anchors = p.chart.anchors || [];
  if (anchors.length === 0) return null;
  if (anchors.length === 1) return anchors[0].y + (rowNum - anchors[0].row) * 20;
  // Sort anchors by row
  var sorted = anchors.slice().sort(function(a,b){return a.row-b.row;});
  // Extrapolate before first anchor
  if (rowNum <= sorted[0].row) {
    var dy = (sorted[1].y - sorted[0].y) / (sorted[1].row - sorted[0].row);
    return sorted[0].y + (rowNum - sorted[0].row) * dy;
  }
  // Extrapolate after last anchor
  var last = sorted[sorted.length-1];
  var prev = sorted[sorted.length-2];
  if (rowNum >= last.row) {
    var dy2 = (last.y - prev.y) / (last.row - prev.row);
    return last.y + (rowNum - last.row) * dy2;
  }
  // Interpolate between surrounding anchors
  for (var i = 0; i < sorted.length-1; i++) {
    if (rowNum >= sorted[i].row && rowNum <= sorted[i+1].row) {
      var t = (rowNum - sorted[i].row) / (sorted[i+1].row - sorted[i].row);
      return sorted[i].y + t * (sorted[i+1].y - sorted[i].y);
    }
  }
  return null;
}

function renderChart() {
  var p = getProject();
  var el = document.getElementById('chartContent');
  if (!p) { el.innerHTML = '<div class="chart-empty"><p>請先選擇作品</p></div>'; return; }
  if (!p.chart) p.chart = chartNewData();
  if (!p.chart.anchors) p.chart.anchors = [];
  if (!p.chart.rowOverrides) p.chart.rowOverrides = {};

  // If canvas already exists and image is loaded, just redraw
  var existingCanvas = document.getElementById('chartCanvas');
  if (existingCanvas && chartImg && chartImg.complete && chartImg.naturalWidth > 0) {
    drawChart();
    updateChartAnchorList(p);
    updateChartStatusBar(p);
    return;
  }

  var hasImg = !!p.chart.imageData;
  var hasAnchors = p.chart.anchors.length >= 2;
  var unit = p.type === 'round' ? '圈' : '行';

  var html = '<div class="chart-toolbar">';
  html += '<button class="chart-tool-btn" onclick="document.getElementById(\'chartFileInput\').click()">📷 上傳 / 拍照</button>';
  if (hasImg) html += '<button class="chart-tool-btn" id="btnAddAnchor" onclick="startAddAnchor()">&#x1F4CC; 加錨點</button>';
  if (hasImg && hasAnchors) html += '<button class="chart-tool-btn" id="btnDrag" onclick="startDragMode()">&#x2195;&#xFE0F; 微調行</button>';
  if (hasImg && hasAnchors) html += '<button class="chart-tool-btn" onclick="startStitchCalib()">&#x1F9F5; 針數校準</button>';
  if (hasImg) html += '<button class="chart-tool-btn" onclick="clearChartData()">&#x1F5D1;</button>';
  html += '</div>';

  html += '<div class="chart-status-bar" id="chartStatusBar">';
  if (!hasImg) html += '上傳織圖，讓 App 追蹤你的進度';
  else if (!hasAnchors) html += '&#x1F4CC; 點「加錨點」，在圖上點出幾個行的位置';
  else html += '第 ' + p.row + ' ' + unit + ' &nbsp;&#183;&nbsp; 第 ' + p.stitch + ' 針　｜ 錨點 ' + p.chart.anchors.length + ' 個';
  html += '</div>';

  if (!hasImg) {
    html += '<div class="chart-empty"><div class="emoji">&#x1F5FA;</div><p>上傳織圖圖片（或直接拍照）<br>支援多點校準＋手動微調</p><button class="chart-upload-btn" onclick="document.getElementById(\'chartFileInput\').click()">📷 上傳 / 拍照</button></div>';
  } else {
    html += '<div class="chart-canvas-wrap"><canvas id="chartCanvas"></canvas></div>';
    html += '<div class="chart-info" id="chartInfo"></div>';
  }

  // anchor list
  if (hasImg && p.chart.anchors.length > 0) {
    html += '<div style="padding:0 16px 8px"><div class="section-label" style="margin-bottom:8px">已設錨點</div><div id="chartAnchorList">';
    var sorted = p.chart.anchors.slice().sort(function(a,b){return a.row-b.row;});
    html += '<div id="chartAnchorList">';
    for (var i=0;i<sorted.length;i++) {
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--brown-light)">';
      html += '<span style="width:20px;height:20px;background:var(--clay);border-radius:50%;color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">' + (i+1) + '</span>';
      html += unit + ' ' + sorted[i].row;
      html += '<button onclick="removeAnchor(' + sorted[i].row + ')" style="margin-left:auto;background:none;border:none;color:var(--brown-light);font-size:16px;cursor:pointer;padding:2px 6px">&#215;</button>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  el.innerHTML = html;
  chartMode = 'view';

  if (hasImg) {
    if (chartImg && chartImg.complete && chartImg.naturalWidth > 0 && chartImg.src.length > 100) {
      // already loaded, draw immediately
      drawChart();
      setTimeout(function() { setupChartEvents(); }, 50);
    } else {
      chartImg = new Image();
      chartImg.onload = function() { drawChart(); setupChartEvents(); };
      chartImg.src = p.chart.imageData;
    }
  }
}

function setupChartEvents() {
  var cv = document.getElementById('chartCanvas'); if (!cv) return;
  cv.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (chartMode === 'drag' && dragRowNum !== null) {
      endDrag();
      return;
    }
    var t = e.changedTouches[0];
    var r = cv.getBoundingClientRect();
    onChartPointer(t.clientX - r.left, t.clientY - r.top, r.width, r.height);
  }, {passive:false});
  cv.addEventListener('touchstart', function(e) {
    if (chartMode !== 'drag') return;
    e.preventDefault();
    var t = e.touches[0];
    var r = cv.getBoundingClientRect();
    startDragAt(t.clientX - r.left, t.clientY - r.top, r.width, r.height);
  }, {passive:false});
  cv.addEventListener('touchmove', function(e) {
    if (chartMode !== 'drag' || dragRowNum === null) return;
    e.preventDefault();
    var t = e.touches[0];
    var r = cv.getBoundingClientRect();
    moveDragAt(t.clientY - r.top, r.height);
  }, {passive:false});
  cv.addEventListener('mousedown', function(e) {
    if (chartMode !== 'drag') return;
    var r = cv.getBoundingClientRect();
    startDragAt(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
    function onMove(ev) { var r2 = cv.getBoundingClientRect(); moveDragAt(ev.clientY - r2.top, r2.height); }
    function onUp() { endDrag(); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function onChartPointer(x, y, dispW, dispH) {
  var p = getProject(); if (!p || !chartImg) return;
  var rawX = x * (chartImg.naturalWidth / dispW);
  var rawY = y * (chartImg.naturalHeight / dispH);

  if (chartMode === 'addAnchor') {
    var p2 = getProject(); if (!p2) return;
    var rowNum = anchorCurrentRow;
    p2.chart.anchors = p2.chart.anchors.filter(function(a) { return a.row !== rowNum; });
    p2.chart.anchors.push({ row: rowNum, y: rawY });
    save(); renderChart();
    showToast('已加第 ' + rowNum + ' ' + (p2.type==='round'?'圈':'行') + ' 錨點');
    chartMode = 'addAnchor'; // stay in addAnchor mode for more points
  } else if (chartMode === 'stitchCalib1') {
    p.chart.stitchX1 = rawX;
    chartMode = 'stitchCalib2';
    setStatusBar('&#x1F446; 再點第 2 針的位置');
    drawChart();
  } else if (chartMode === 'stitchCalib2') {
    p.chart.stitchX2 = rawX;
    chartMode = 'view';
    save(); drawChart();
    setStatusBar('針數校準完成！');
    showToast('針數校準完成！');
  }
}

function startDragAt(x, y, dispW, dispH) {
  var p = getProject(); if (!p || !chartImg) return;
  var rawY = y * (chartImg.naturalHeight / dispH);
  var best = null; var bestDist = 30;
  for (var r = 1; r <= p.total; r++) {
    var ry = getRowY(p, r);
    if (ry === null) continue;
    var dist = Math.abs(ry - rawY);
    if (dist < bestDist) { bestDist = dist; best = r; }
  }
  if (best !== null) {
    dragRowNum = best;
    dragStartY = rawY;
    dragOrigY = getRowY(p, best);
  }
}
function moveDragAt(y, dispH) {
  var p = getProject(); if (!p || !chartImg || dragRowNum === null) return;
  var rawY = y * (chartImg.naturalHeight / dispH);
  p.chart.rowOverrides[dragRowNum] = rawY;
  drawChart();
}
function endDrag() {
  var p = getProject();
  if (p) save();
  dragRowNum = null;
}

function drawChart() {
  var p = getProject(); if (!p) return;
  var cv = document.getElementById('chartCanvas'); if (!cv || !chartImg) return;
  var wrap = cv.parentElement;
  var dw = wrap.clientWidth;
  var imgScale = dw / chartImg.naturalWidth;
  var maxRowY = getRowY(p, p.total);
  var extraH = maxRowY !== null ? Math.max(0, maxRowY * imgScale - chartImg.naturalHeight * imgScale + 60) : 0;
  var dh = chartImg.naturalHeight * imgScale + extraH;
  cv.width = dw; cv.height = dh; cv.style.height = dh + 'px';
  var ctx = cv.getContext('2d');
  ctx.fillStyle = '#F7F3EE';
  ctx.fillRect(0, 0, dw, dh);
  ctx.drawImage(chartImg, 0, 0, dw, chartImg.naturalHeight * imgScale);

  var unit = p.type === 'round' ? '圈' : '行';
  var hasAnchors = p.chart.anchors && p.chart.anchors.length >= 2;
  if (!hasAnchors && p.chart.anchors && p.chart.anchors.length === 1) {
    // draw single anchor dot
    var ay = p.chart.anchors[0].y * imgScale;
    ctx.fillStyle = '#C4674A';
    ctx.beginPath(); ctx.arc(20, ay, 7, 0, Math.PI*2); ctx.fill();
    return;
  }
  if (!hasAnchors) return;

  // draw all anchor markers (subtle)
  var anchors = p.chart.anchors;
  for (var i=0;i<anchors.length;i++) {
    var ay2 = getRowY(p, anchors[i].row) * imgScale;
    ctx.strokeStyle = 'rgba(122,173,168,0.6)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(0, ay2); ctx.lineTo(dw, ay2); ctx.stroke();
    ctx.setLineDash([]);
    // anchor dot
    ctx.fillStyle = '#7AADA8';
    ctx.beginPath(); ctx.arc(14, ay2, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white';
    ctx.font = 'bold 8px Inter,sans-serif';
    ctx.fillText(anchors[i].row, 10, ay2+3);
  }

  // ── 已完成行覆蓋（第1行到目前行-1）──
  if (p.row > 1) {
    var firstRawY = getRowY(p, 1);
    var prevRawY = getRowY(p, p.row - 1);
    if (firstRawY !== null && prevRawY !== null) {
      var topY = Math.min(firstRawY, prevRawY) * imgScale;
      var botY = Math.max(firstRawY, prevRawY) * imgScale;
      // extend half a row above first and below last completed
      var rowH = bandH;
      ctx.fillStyle = 'rgba(90,160,120,0.18)';
      ctx.fillRect(0, topY - rowH/2, dw, botY - topY + rowH);
      // 完成標記線（淡綠）
      for (var cr = 1; cr < p.row; cr++) {
        var cry = getRowY(p, cr);
        if (cry === null) continue;
        ctx.strokeStyle = 'rgba(90,160,120,0.35)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3,4]);
        ctx.beginPath(); ctx.moveTo(0, cry * imgScale); ctx.lineTo(dw, cry * imgScale); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  // current row
  var curRawY = getRowY(p, p.row);
  if (curRawY === null) return;
  var curY = curRawY * imgScale;

  // estimate row spacing for band height
  var nextRawY = getRowY(p, p.row+1);
  var bandH = nextRawY !== null ? Math.max(Math.abs((nextRawY - curRawY) * imgScale) * 0.75, 8) : 14;

  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(196,103,74,0.28)';
  ctx.fillRect(0, curY - bandH/2, dw, bandH);

  ctx.strokeStyle = '#C4674A';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, curY); ctx.lineTo(dw, curY); ctx.stroke();

  var txt = unit + ' ' + p.row;
  ctx.font = 'bold 12px Inter,sans-serif';
  var tw = ctx.measureText(txt).width;
  ctx.fillStyle = '#C4674A';
  ctx.beginPath(); ctx.roundRect(6, curY - 22, tw+14, 18, 9); ctx.fill();
  ctx.fillStyle = 'white'; ctx.fillText(txt, 13, curY - 8);

  // drag mode — show all row lines faintly
  if (chartMode === 'drag') {
    for (var r=1;r<=p.total;r++) {
      if (r===p.row) continue;
      var ry = getRowY(p,r);
      if (ry===null) continue;
      var ryD = ry * imgScale;
      ctx.strokeStyle = 'rgba(196,103,74,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0,ryD); ctx.lineTo(dw,ryD); ctx.stroke();
    }
  }

  // stitch line — show if calibrated
  var ch = p.chart;
  if (ch.stitchX1 !== null && ch.stitchX2 !== null) {
    var stitchSpacing = (ch.stitchX2 - ch.stitchX1) * imgScale;
    var baseX = ch.stitchX1 * imgScale;
    var stitchNum = Math.max(1, p.stitch);
    var curX = baseX + (stitchNum - 1) * stitchSpacing;

    ctx.strokeStyle = '#7AADA8'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(curX, 0); ctx.lineTo(curX, dh); ctx.stroke();

    var ntxt = '針 ' + p.stitch;
    ctx.font = 'bold 12px Inter,sans-serif';
    var ntw = ctx.measureText(ntxt).width;
    ctx.fillStyle = '#7AADA8';
    ctx.beginPath(); ctx.roundRect(curX+5, 6, ntw+14, 18, 9); ctx.fill();
    ctx.fillStyle = 'white'; ctx.fillText(ntxt, curX+12, 20);

    ctx.fillStyle = '#C4674A'; ctx.beginPath(); ctx.arc(curX, curY, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(curX, curY, 4, 0, Math.PI*2); ctx.fill();
  }

  var info = document.getElementById('chartInfo');
  if (info) {
    var modeHint = chartMode === 'drag' ? '　｜ 拖曳橫線微調位置' : '';
    info.textContent = '錨點 ' + anchors.length + ' 個' + (ch.stitchX1!==null?'　針數已校準':'') + modeHint;
  }
  var sb = document.getElementById('chartStatusBar');
  if (sb && chartMode === 'view') {
    sb.textContent = '第 ' + p.row + ' ' + unit + ' · 第 ' + p.stitch + ' 針';
  }
}

function updateChartStatusBar(p) {
  var unit = p.type === 'round' ? '圈' : '行';
  var sb = document.getElementById('chartStatusBar');
  if (sb && chartMode === 'view') sb.textContent = '第 ' + p.row + ' ' + unit + ' · 第 ' + p.stitch + ' 針';
}

function updateChartAnchorList(p) {
  var el = document.getElementById('chartAnchorList');
  if (!el) return;
  var unit = p.type === 'round' ? '圈' : '行';
  var sorted = p.chart.anchors.slice().sort(function(a,b){return a.row-b.row;});
  var html = '';
  for (var i=0;i<sorted.length;i++) {
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;color:var(--brown-light)">';
    html += '<span style="width:20px;height:20px;background:var(--clay);border-radius:50%;color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">' + (i+1) + '</span>';
    html += unit + ' ' + sorted[i].row;
    html += '<button onclick="removeAnchor(' + sorted[i].row + ')" style="margin-left:auto;background:none;border:none;color:var(--brown-light);font-size:16px;cursor:pointer;padding:2px 6px">&#215;</button>';
    html += '</div>';
  }
  el.innerHTML = html;
}

function startAddAnchor() {
  var p = getProject(); if (!p) return;
  anchorCurrentRow = p.row;
  chartMode = 'addAnchor';
  setStatusBar('第 <b>' + anchorCurrentRow + '</b> ' + (p.type==='round'?'圈':'行') + ' &nbsp;' +
    '<button onclick="anchorRowDown()" style="background:var(--cream);border:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer">−</button>' +
    '<button onclick="anchorRowUp()" style="background:var(--cream);border:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer;margin-left:4px">＋</button>' +
    ' &nbsp;→ 點圖上該行位置');
}
function anchorRowUp() {
  var p = getProject(); if (!p) return;
  anchorCurrentRow++;
  setStatusBar('第 <b>' + anchorCurrentRow + '</b> ' + (p.type==='round'?'圈':'行') + ' &nbsp;' +
    '<button onclick="anchorRowDown()" style="background:var(--cream);border:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer">−</button>' +
    '<button onclick="anchorRowUp()" style="background:var(--cream);border:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer;margin-left:4px">＋</button>' +
    ' &nbsp;→ 點圖上該行位置');
}
function anchorRowDown() {
  var p = getProject(); if (!p) return;
  anchorCurrentRow = Math.max(1, anchorCurrentRow - 1);
  setStatusBar('第 <b>' + anchorCurrentRow + '</b> ' + (p.type==='round'?'圈':'行') + ' &nbsp;' +
    '<button onclick="anchorRowDown()" style="background:var(--cream);border:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer">−</button>' +
    '<button onclick="anchorRowUp()" style="background:var(--cream);border:none;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer;margin-left:4px">＋</button>' +
    ' &nbsp;→ 點圖上該行位置');
}
function startDragMode() {
  chartMode = 'drag';
  setStatusBar('&#x2195;&#xFE0F; 拖曳橫線微調　<button class="skip-btn" onclick="exitDragMode()">完成</button>');
  drawChart();
}
function exitDragMode() { chartMode = 'view'; drawChart(); setStatusBar('微調完成'); }
function startStitchCalib() {
  chartMode = 'stitchCalib1';
  setStatusBar('&#x1F446; 點第 1 針的位置');
  showToast('點第 1 針位置');
}
function removeAnchor(rowNum) {
  var p = getProject(); if (!p) return;
  p.chart.anchors = p.chart.anchors.filter(function(a){return a.row!==rowNum;});
  if (p.chart.rowOverrides) delete p.chart.rowOverrides[rowNum];
  save(); renderChart();
}
function setStatusBar(html) { var sb=document.getElementById('chartStatusBar'); if(sb) sb.innerHTML=html; }
function triggerChartUpload() { document.getElementById('chartFileInput').click(); }
function onChartFileSelected(e) {
  try {
    var file = e.target.files[0]; if (!file) return;
    var p = getProject(); if (!p) return;
    var reader = new FileReader();
    reader.onerror = function() { showToast('讀取圖片失敗，請重試'); };
    reader.onload = function(ev) {
      try {
        p.chart = chartNewData();
        p.chart.imageData = ev.target.result;
        save(); renderChart();
        setTimeout(function() { startAddAnchor(); }, 400);
      } catch(err) { showToast('載入圖片失敗'); }
    };
    reader.readAsDataURL(file);
    try { e.target.value = ''; } catch(err) {}
  } catch(err) { showToast('發生錯誤，請重試'); }
}
function clearChartData() {
  var p = getProject(); if (!p) return;
  p.chart = chartNewData();
  chartImg=null; chartMode='view'; save(); renderChart(); showToast('已清除織圖');
}

function switchTab(tab) {
  exitFocusMode();
  currentTab = tab;
  var ts = ['list','counter','chart','notes'];
  for (var i=0;i<ts.length;i++) {
    var t=ts[i];
    var pg=document.getElementById('page'+t[0].toUpperCase()+t.slice(1));
    var tb=document.getElementById('tab'+t[0].toUpperCase()+t.slice(1));
    if(pg) pg.classList.toggle('active',t===tab);
    if(tb) tb.classList.toggle('active',t===tab);
  }
  if (tab==='list') {
    document.getElementById('headerTitle').textContent = '🧶 我的作品';
    document.getElementById('headerSub').style.display='none';
    document.getElementById('headerBack').style.display='none';
    currentProjectId = null;
    renderList();
  } else if (tab==='counter') {
    if(currentProjectId) renderCounter(); else switchTab('list');
  } else if (tab==='chart') {
    if(currentProjectId) {
      chartCalibStep=0;
      var cv = document.getElementById('chartCanvas');
      if (cv && chartImg && chartImg.complete && chartImg.naturalWidth > 0) {
        // page just became visible, draw after browser paint
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            drawChart();
            updateChartStatusBar(getProject());
          });
        });
      } else {
        renderChart();
      }
    } else switchTab('list');
  } else if (tab==='notes') {
    if(currentProjectId) { var p=getProject(); if(p) document.getElementById('notesArea').value=p.notes||''; }
    else switchTab('list');
  }
  window.scrollTo(0,0);
}

function showToast(msg) {
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}

document.getElementById('jumpInput').addEventListener('keydown',function(e){
  if(e.key==='Enter') applyJump();
  if(e.key==='Escape') closeJump();
});

function checkInstallBanner() {
  var banner = document.getElementById('installBanner');
  if (!banner) return;
  banner.style.display = 'flex';
}
